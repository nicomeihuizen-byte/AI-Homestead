ily="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#87847d" text-anchor="end">2.02 d</text><path d="M161.69,241.13 A196.00,196.00 0 0 1 292.45,184.15 L296.30,284.07 A96.00,96.00 0 0 0 232.25,311.98 Z" fill="#008300"/><text x="213.7" y="180.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b0b0b" text-anchor="end">Psc</text><text x="213.7" y="195.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#87847d" text-anchor="end">3.29 d</text><path d="M294.50,184.08 A196.00,196.00 0 0 1 298.97,184.00 L299.50,284.00 A96.00,96.00 0 0 0 297.31,284.04 Z" fill="#b8b5ad"/><circle cx="300.0" cy="380.0" r="88.0" fill="#f4f2ee"/><text x="300.0" y="374.0" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0b0b0b" text-anchor="middle">27.32</text><text x="300.0" y="396.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" text-anchor="middle">days</text><text x="300.0" y="416.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#87847d" text-anchor="middle">one sidereal month</text><rect x="72.0" y="626.0" width="456.0" height="40.0" rx="8" fill="#f4f2ee"/><rect x="88.0" y="638.0" width="12.0" height="16.0" rx="3" fill="#eda100"/><text x="108.0" y="651.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="start">longest — Virgo, 3.30 d</text><rect x="292.0" y="638.0" width="12.0" height="16.0" rx="3" fill="#008300"/><text x="312.0" y="651.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="start">shortest — Scorpius, 0.68 d</text><rect x="564.0" y="96.0" width="360.0" height="176.0" rx="8" fill="#f4f2ee"/><text x="582.0" y="122.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0b0b0b" text-anchor="start">Element → plant organ</text><rect x="582.0" y="137.0" width="12.0" height="12.0" rx="3" fill="#eda100"/><text x="602.0" y="147.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">Root</text><text x="648.0" y="147.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">earth</text><text x="924.0" y="147.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#52514e" text-anchor="end">7.35 d</text><text x="602.0" y="161.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#87847d" text-anchor="start">Taurus, Virgo, Capricorn</text><rect x="582.0" y="168.0" width="12.0" height="12.0" rx="3" fill="#008300"/><text x="602.0" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">Leaf</text><text x="648.0" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">water</text><text x="924.0" y="178.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#52514e" text-anchor="end">6.84 d</text><text x="602.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#87847d" text-anchor="start">Cancer, Scorpio, Pisces</text><rect x="582.0" y="199.0" width="12.0" height="12.0" rx="3" fill="#4a3aa7"/><text x="602.0" y="209.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">Flower</text><text x="648.0" y="209.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">air / light</text><text x="924.0" y="209.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#52514e" text-anchor="end">5.63 d</text><text x="602.0" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#87847d" text-anchor="start">Gemini, Libra, Aquarius</text><rect x="582.0" y="230.0" width="12.0" height="12.0" rx="3" fill="#e34948"/><text x="602.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">Fruit</text><text x="648.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">fire / warmth</text><text x="924.0" y="240.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#52514e" text-anchor="end">6.52 d</text><text x="602.0" y="254.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#87847d" text-anchor="start">Aries, Leo, Sagittarius</text><rect x="564.0" y="292.0" width="360.0" height="96.0" rx="8" fill="#f4f2ee"/><rect x="582.0" y="312.0" width="12.0" height="12.0" rx="3" fill="#6f6c66"/><text x="602.0" y="322.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">Ophiuchus — 1.27 d/month</text><text x="582.0" y="342.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">On the ecliptic, but not in Thun's 12-fold zodiac.</text><text x="582.0" y="358.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">The printed calendars extend the Scorpio/water</text><text x="582.0" y="374.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">region across it. Fold it — but flag it.</text><rect x="564.0" y="406.0" width="360.0" height="96.0" rx="8" fill="#f4f2ee"/><rect x="582.0" y="426.0" width="12.0" height="12.0" rx="3" fill="#b8b5ad"/><text x="602.0" y="436.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">Orion, Sextans, Cetus — 0.98 d/month</text><text x="582.0" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">The Moon's orbit is inclined ~5.1°, so it strays</text><text x="582.0" y="472.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">outside the zodiac entirely. Return None and log —</text><text x="582.0" y="488.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">never crash, never silently default.</text><line x1="564.0" y1="522.0" x2="924.0" y2="522.0" stroke="#e2ded6" stroke-width="1" stroke-linecap="round"/><text x="564.0" y="546.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#87847d" text-anchor="start">Computed: skyfield 1.55, de421.bsp, IAU/Delporte</text><text x="564.0" y="562.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#87847d" text-anchor="start">boundaries. 2026-2036, 30-minute steps.</text><text x="564.0" y="586.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#87847d" text-anchor="start">Reproduce: scripts/make_diagrams.py</text><text x="72.0" y="700.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start" font-style="italic">That 4.8× spread is the point: it is why the day types cannot be equally frequent.</text></svg>

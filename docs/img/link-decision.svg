<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Choosing the field-to-house link by measured distance"><title>Choosing the field-to-house link by measured distance</title><rect x="0.0" y="0.0" width="900.0" height="360.0" rx="10" fill="#fcfcfb" stroke="#e2ded6" stroke-width="1"/><text x="32.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#0b0b0b" text-anchor="start">Measure the distance before you choose the radio</text><text x="32.0" y="68.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" text-anchor="start">This is the one architectural choice that is awkward to reverse. Phase 0 decides it.</text><rect x="61.0" y="108.0" width="128.0" height="30.0" rx="4" fill="#008300"/><text x="125.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">BLE</text><rect x="191.0" y="108.0" width="193.0" height="30.0" rx="4" fill="#eda100"/><text x="287.5" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">marginal</text><rect x="386.0" y="108.0" width="453.0" height="30.0" rx="4" fill="#e34948"/><text x="612.5" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">LoRa SX1262</text><line x1="60.0" y1="154.0" x2="840.0" y2="154.0" stroke="#e2ded6" stroke-width="1" stroke-linecap="round"/><line x1="60.0" y1="150.0" x2="60.0" y2="158.0" stroke="#87847d" stroke-width="1" stroke-linecap="round"/><text x="60.0" y="176.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52514e" text-anchor="middle">0 m</text><line x1="190.0" y1="150.0" x2="190.0" y2="158.0" stroke="#87847d" stroke-width="1" stroke-linecap="round"/><text x="190.0" y="176.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52514e" text-anchor="middle">20 m</text><line x1="385.0" y1="150.0" x2="385.0" y2="158.0" stroke="#87847d" stroke-width="1" stroke-linecap="round"/><text x="385.0" y="176.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52514e" text-anchor="middle">50 m</text><line x1="840.0" y1="150.0" x2="840.0" y2="158.0" stroke="#87847d" stroke-width="1" stroke-linecap="round"/><text x="840.0" y="176.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52514e" text-anchor="middle">120 m+</text><rect x="60.0" y="193.0" width="11.0" height="11.0" rx="3" fill="#008300"/><text x="80.0" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="start">0–20 m, clear line of sight</text><text x="260.0" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">the simplest thing that works, no extra radios</text><rect x="60.0" y="217.0" width="11.0" height="11.0" rx="3" fill="#eda100"/><text x="80.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="start">20–50 m, some vegetation</text><text x="260.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">works in July, drops out in a wet November</text><rect x="60.0" y="241.0" width="11.0" height="11.0" rx="3" fill="#e34948"/><text x="80.0" y="250.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="start">50 m and beyond</text><text x="260.0" y="250.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">20–40 dB of margin you never think about again</text><line x1="32.0" y1="292.0" x2="868.0" y2="292.0" stroke="#e2ded6" stroke-width="1" stroke-linecap="round"/><text x="32.0" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">BLE's limit here is not throughput; your payload is ~10 bits/second against a 235 kbps floor. It is that a dropped link</text><text x="32.0" y="334.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">fails silently, with no retry, during exactly the weather worth observing.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="De Bilt irradiance, June versus December"><title>De Bilt irradiance, June versus December</title><rect x="0.0" y="0.0" width="900.0" height="300.0" rx="10" fill="#fcfcfb" stroke="#e2ded6" stroke-width="1"/><text x="32.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#0b0b0b" text-anchor="start">The constraint behind every hardware decision</text><text x="32.0" y="68.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" text-anchor="start">24-hour mean solar irradiance at De Bilt, 1991–2020 normals (KNMI).</text><rect x="90.0" y="116.0" width="96.0" height="120.0" rx="4" fill="#eda100"/><text x="138.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0b0b0b" text-anchor="middle">200</text><text x="138.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="middle">June</text><rect x="310.0" y="224.0" width="96.0" height="12.0" rx="4" fill="#4a3aa7"/><text x="358.0" y="214.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0b0b0b" text-anchor="middle">20</text><text x="358.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="middle">December</text><text x="90.0" y="278.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#87847d" text-anchor="start">W/m², 24-hour mean</text><line x1="80.0" y1="236.0" x2="400.0" y2="236.0" stroke="#e2ded6" stroke-width="1" stroke-linecap="round"/><rect x="452.0" y="96.0" width="416.0" height="168.0" rx="8" fill="#f4f2ee"/><text x="474.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0b0b0b" text-anchor="start">A factor of ten, not a factor of two.</text><text x="474.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">≈ 4.8 peak-sun-hours in June against ≈ 0.5 in December.</text><text x="474.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">And that 20 W/m² is a monthly mean. NL routinely delivers</text><text x="474.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">runs of 5–10 consecutive overcast days at 0.05–0.15 PSH,</text><text x="474.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">effectively no harvest at all.</text><text x="474.0" y="238.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="start">Size the panel for the mean.</text><text x="474.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="start">Size the battery for the dark run.</text></svg>

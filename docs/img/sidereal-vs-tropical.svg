<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Sidereal constellations versus tropical signs"><title>Sidereal constellations versus tropical signs</title><rect x="0.0" y="0.0" width="900.0" height="330.0" rx="10" fill="#fcfcfb" stroke="#e2ded6" stroke-width="1"/><text x="32.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#0b0b0b" text-anchor="start">Sidereal, not tropical</text><text x="32.0" y="68.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" text-anchor="start">The zodiac signs used by astrology drifted off the constellations they were named for. They no longer line up.</text><text x="32.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52514e" text-anchor="start">Tropical signs — equal 30° each</text><rect x="61.0" y="128.0" width="128.0" height="34.0" rx="4" fill="#f4f2ee" stroke="#e2ded6" stroke-width="1"/><text x="125.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="middle">Aries</text><rect x="191.0" y="128.0" width="128.0" height="34.0" rx="4" fill="#f4f2ee" stroke="#e2ded6" stroke-width="1"/><text x="255.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="middle">Taurus</text><rect x="321.0" y="128.0" width="128.0" height="34.0" rx="4" fill="#f4f2ee" stroke="#e2ded6" stroke-width="1"/><text x="385.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="middle">Gemini</text><rect x="451.0" y="128.0" width="128.0" height="34.0" rx="4" fill="#f4f2ee" stroke="#e2ded6" stroke-width="1"/><text x="515.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="middle">Cancer</text><rect x="581.0" y="128.0" width="128.0" height="34.0" rx="4" fill="#f4f2ee" stroke="#e2ded6" stroke-width="1"/><text x="645.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="middle">Leo</text><rect x="711.0" y="128.0" width="128.0" height="34.0" rx="4" fill="#f4f2ee" stroke="#e2ded6" stroke-width="1"/><text x="775.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="middle">Virgo</text><text x="32.0" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="start">Real constellations — unequal widths, ~24° behind</text><rect x="61.0" y="212.0" width="102.0" height="34.0" rx="4" fill="#008300"/><text x="112.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Pisces</text><rect x="165.0" y="212.0" width="99.8" height="34.0" rx="4" fill="#e34948"/><text x="214.9" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Aries</text><rect x="266.8" y="212.0" width="149.3" height="34.0" rx="4" fill="#eda100"/><text x="341.5" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Taurus</text><rect x="418.1" y="212.0" width="113.0" height="34.0" rx="4" fill="#4a3aa7"/><text x="474.6" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Gemini</text><rect x="533.2" y="212.0" width="80.9" height="34.0" rx="4" fill="#008300"/><text x="573.6" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Cancer</text><rect x="616.0" y="212.0" width="145.6" height="34.0" rx="4" fill="#e34948"/><text x="688.8" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Leo</text><rect x="763.6" y="212.0" width="75.4" height="34.0" rx="4" fill="#eda100"/><text x="801.3" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Virgo</text><line x1="365.5" y1="118.0" x2="365.5" y2="262.0" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="365.5" cy="118.0" r="4.0" fill="#0b0b0b"/><text x="375.5" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="start">the Moon is here</text><text x="375.5" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#87847d" text-anchor="start">tropical sign says Gemini → flower day</text><text x="375.5" y="268.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">the actual sky says Taurus → root day</text><line x1="32.0" y1="288.0" x2="868.0" y2="288.0" stroke="#e2ded6" stroke-width="1" stroke-linecap="round"/><text x="32.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">A tropical implementation is wrong by roughly two days, every day. This is the most common bug in hobby versions of this calendar.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Winter sun at the two plots"><title>Winter sun at the two plots</title><rect x="0.0" y="0.0" width="900.0" height="340.0" rx="10" fill="#fcfcfb" stroke="#e2ded6" stroke-width="1"/><text x="32.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#0b0b0b" text-anchor="start">The constraint behind every hardware decision</text><text x="32.0" y="68.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" text-anchor="start">Sun at solar noon on the winter solstice, and hours of daylight. Geometry, not measurements, so these are exact.</text><line x1="104.0" y1="262.0" x2="240.0" y2="262.0" stroke="#e2ded6" stroke-width="1" stroke-linecap="round"/><path d="M120.00,162.00 A100.00,100.00 0 0 1 220.00,262.00 L220.00,262.00 A100.00,100.00 0 0 0 120.00,162.00 Z" fill="none" stroke="#e6e4df" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.0,262.0 L217.7,240.9" fill="none" stroke="#4a3aa7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="217.7" cy="240.9" r="8.0" fill="#4a3aa7"/><text x="232.7" y="245.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#0b0b0b" text-anchor="start">12.2°</text><circle cx="120.0" cy="262.0" r="3.0" fill="#0b0b0b"/><text x="104.0" y="148.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#52514e" text-anchor="start">7.0 h of daylight</text><text x="104.0" y="288.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0b0b0b" text-anchor="start">Prora</text><text x="104.0" y="306.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#87847d" text-anchor="start">54.39 N · summer plot</text><line x1="324.0" y1="262.0" x2="460.0" y2="262.0" stroke="#e2ded6" stroke-width="1" stroke-linecap="round"/><path d="M340.00,162.00 A100.00,100.00 0 0 1 440.00,262.00 L440.00,262.00 A100.00,100.00 0 0 0 340.00,162.00 Z" fill="none" stroke="#e6e4df" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.0,262.0 L429.3,217.1" fill="none" stroke="#eda100" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="429.3" cy="217.1" r="8.0" fill="#eda100"/><text x="444.3" y="222.1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#0b0b0b" text-anchor="start">26.7°</text><circle cx="340.0" cy="262.0" r="3.0" fill="#0b0b0b"/><text x="324.0" y="148.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#52514e" text-anchor="start">9.2 h of daylight</text><text x="324.0" y="288.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0b0b0b" text-anchor="start">Castelo Branco</text><text x="324.0" y="306.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#87847d" text-anchor="start">39.82 N · winter plot</text><rect x="500.0" y="96.0" width="368.0" height="186.0" rx="8" fill="#f4f2ee"/><text x="522.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0b0b0b" text-anchor="start">Prora sizes the hardware.</text><text x="522.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">Seven hours of daylight against nine, and a sun that</text><text x="522.0" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">peaks less than halfway as high. Low sun is not a</text><text x="522.0" y="188.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">small correction: it is most of the loss, because the</text><text x="522.0" y="206.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">beam spreads over more ground and more atmosphere.</text><text x="522.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="start">The node is one design, driven between both plots,</text><text x="522.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="start">so it gets built for the worse case.</text><text x="522.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#87847d" text-anchor="start" font-style="italic">Castelo Branco does not get a vote.</text></svg>

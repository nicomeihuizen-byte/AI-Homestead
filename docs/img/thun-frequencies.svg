<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Thun day types are not equally frequent"><title>Thun day types are not equally frequent</title><rect x="0.0" y="0.0" width="900.0" height="340.0" rx="10" fill="#fcfcfb" stroke="#e2ded6" stroke-width="1"/><text x="32.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#0b0b0b" text-anchor="start">Day types are not equally frequent</text><text x="32.0" y="68.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" text-anchor="start">Calendar days in 2027, assigned by which constellation the Moon occupies for most of the day.</text><text x="136.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b0b0b" text-anchor="end">Root</text><rect x="150.0" y="104.0" width="499.3" height="22.0" rx="4" fill="#eda100"/><text x="659.3" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">107 days</text><text x="136.0" y="163.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b0b0b" text-anchor="end">Fruit</text><rect x="150.0" y="148.0" width="452.7" height="22.0" rx="4" fill="#e34948"/><text x="612.7" y="164.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">97 days</text><text x="136.0" y="207.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b0b0b" text-anchor="end">Leaf</text><rect x="150.0" y="192.0" width="438.7" height="22.0" rx="4" fill="#008300"/><text x="598.7" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">94 days</text><text x="662.7" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#87847d" text-anchor="start">82 + 12 folded from Ophiuchus</text><text x="136.0" y="251.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b0b0b" text-anchor="end">Flower</text><rect x="150.0" y="236.0" width="312.7" height="22.0" rx="4" fill="#4a3aa7"/><text x="472.7" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">67 days</text><line x1="150.0" y1="96.0" x2="150.0" y2="266.0" stroke="#e6e4df" stroke-width="1" stroke-linecap="round"/><rect x="32.0" y="292.0" width="836.0" height="0.0" rx="0" fill="#fcfcfb"/><line x1="32.0" y1="286.0" x2="868.0" y2="286.0" stroke="#e2ded6" stroke-width="1" stroke-linecap="round"/><text x="32.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">Root days outnumber flower days by 60%. Any test of the calendar must weight for this, or "root days work better"</text><text x="32.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">is indistinguishable from "root days are more numerous".</text></svg>

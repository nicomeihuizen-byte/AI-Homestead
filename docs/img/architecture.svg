<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-label="System architecture"><title>System architecture</title><rect x="0.0" y="0.0" width="940.0" height="520.0" rx="10" fill="#fcfcfb" stroke="#e2ded6" stroke-width="1"/><text x="32.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#0b0b0b" text-anchor="start">Sensor to scheduler</text><text x="32.0" y="68.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" text-anchor="start">The store is the seam. Everything upstream writes to it; everything downstream reads from it.</text><rect x="32.0" y="96.0" width="300.0" height="386.0" rx="10" fill="#f4f2ee"/><text x="52.0" y="124.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#87847d" text-anchor="start">FIELD</text><text x="52.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0b0b0b" text-anchor="start">Pico 2 W · MicroPython</text><circle cx="58.0" cy="170.0" r="2.5" fill="#87847d"/><text x="70.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">BME280 — air T / RH / pressure</text><circle cx="58.0" cy="192.0" r="2.5" fill="#87847d"/><text x="70.0" y="196.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">DS18B20 ×2 — soil T, 10 &amp; 30 cm</text><circle cx="58.0" cy="214.0" r="2.5" fill="#87847d"/><text x="70.0" y="218.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">Capacitive ×2 — soil moisture</text><circle cx="58.0" cy="236.0" r="2.5" fill="#87847d"/><text x="70.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">BH1750 — lux (not PAR)</text><circle cx="58.0" cy="258.0" r="2.5" fill="#87847d"/><text x="70.0" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">Tipping gauge — rain</text><circle cx="58.0" cy="280.0" r="2.5" fill="#87847d"/><text x="70.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">Anemometer + vane — wind</text><circle cx="58.0" cy="302.0" r="2.5" fill="#87847d"/><text x="70.0" y="306.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">Battery V / panel V</text><line x1="52.0" y1="342.0" x2="312.0" y2="342.0" stroke="#e2ded6" stroke-width="1" stroke-linecap="round"/><text x="52.0" y="366.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">LiFePO4 26650 → CN3791 MPPT</text><text x="52.0" y="386.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">5–10 W panel @ 65° due south</text><text x="52.0" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">Ring buffer + ack'd backfill</text><text x="52.0" y="426.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52514e" text-anchor="start">IP66 box inside the birdbox</text><text x="52.0" y="456.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#008300" text-anchor="start">0.08–0.24 Wh/day</text><path d="M340,250 L392,250" fill="none" stroke="#87847d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M384,244 L392,250 L384,256" fill="none" stroke="#87847d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="366.0" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">BLE</text><text x="366.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#87847d" text-anchor="middle">or LoRa</text><rect x="400.0" y="96.0" width="508.0" height="386.0" rx="10" fill="#f4f2ee"/><text x="422.0" y="124.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#87847d" text-anchor="start">HOUSE</text><text x="422.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0b0b0b" text-anchor="start">oneacre · Python 3.11+</text><rect x="422.0" y="166.0" width="464.0" height="52.0" rx="8" fill="#fcfcfb" stroke="#e2ded6" stroke-width="1"/><rect x="422.0" y="166.0" width="4.0" height="52.0" rx="2" fill="#4a3aa7"/><text x="440.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">ingest/</text><text x="440.0" y="206.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52514e" text-anchor="start">ble_client · knmi · openmeteo · pvgis</text><rect x="422.0" y="232.0" width="464.0" height="52.0" rx="8" fill="#fcfcfb" stroke="#e2ded6" stroke-width="1"/><rect x="422.0" y="232.0" width="4.0" height="52.0" rx="2" fill="#87847d"/><text x="440.0" y="254.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">store/</text><text x="440.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52514e" text-anchor="start">SQLite — raw stays raw, calibration applies on read</text><rect x="422.0" y="298.0" width="464.0" height="52.0" rx="8" fill="#fcfcfb" stroke="#e2ded6" stroke-width="1"/><rect x="422.0" y="298.0" width="4.0" height="52.0" rx="2" fill="#eda100"/><text x="440.0" y="320.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">biodynamic/  ·  solar/</text><text x="440.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52514e" text-anchor="start">skyfield day-type  ·  LSTM PV forecast</text><rect x="422.0" y="364.0" width="464.0" height="52.0" rx="8" fill="#fcfcfb" stroke="#e2ded6" stroke-width="1"/><rect x="422.0" y="364.0" width="4.0" height="52.0" rx="2" fill="#008300"/><text x="440.0" y="386.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">scheduler/</text><text x="440.0" y="404.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52514e" text-anchor="start">local LLM proposes → Python constraints dispose</text><path d="M654,218 L654,232" fill="none" stroke="#87847d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M648,226 L654,232 L660,226" fill="none" stroke="#87847d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M654,284 L654,298" fill="none" stroke="#87847d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M648,292 L654,298 L660,292" fill="none" stroke="#87847d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M654,350 L654,364" fill="none" stroke="#87847d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M648,358 L654,364 L660,358" fill="none" stroke="#87847d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="422.0" y="440.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="start">→ data/briefs/YYYY-MM-DD.md</text><text x="422.0" y="460.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#87847d" text-anchor="start">The daily brief. Every number computed in Python; the model selects and explains.</text></svg>

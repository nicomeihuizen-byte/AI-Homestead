<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Daily energy budget: Pi versus Pico"><title>Daily energy budget: Pi versus Pico</title><rect x="0.0" y="0.0" width="900.0" height="360.0" rx="10" fill="#fcfcfb" stroke="#e2ded6" stroke-width="1"/><text x="32.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#0b0b0b" text-anchor="start">Why the field node is a Pico W, not a Pi</text><text x="32.0" y="68.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" text-anchor="start">Energy consumed per day, and the December panel needed to replace it in the Dutch winter.</text><text x="216.0" y="123.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="end">Pi Zero 2 W, always on</text><rect x="230.0" y="108.0" width="403.2" height="22.0" rx="4" fill="#e34948"/><text x="643.2" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">14.4 Wh/day</text><text x="230.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#87847d" text-anchor="start">~48 W panel · 100 Wh battery</text><text x="216.0" y="183.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="end">Pi Zero 2 W, duty-cycled</text><rect x="230.0" y="168.0" width="67.2" height="22.0" rx="4" fill="#eda100"/><text x="307.2" y="184.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">2.4 Wh/day</text><text x="230.0" y="206.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#87847d" text-anchor="start">~8 W panel · 17 Wh battery</text><text x="216.0" y="243.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="end">Pico W, duty-cycled</text><rect x="230.0" y="228.0" width="4.5" height="22.0" rx="4" fill="#008300"/><text x="244.5" y="244.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">0.16 Wh/day</text><text x="230.0" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#87847d" text-anchor="start">~1 W by arithmetic — buy 5–10 W</text><line x1="230.0" y1="100.0" x2="230.0" y2="258.0" stroke="#e6e4df" stroke-width="1" stroke-linecap="round"/><line x1="32.0" y1="300.0" x2="868.0" y2="300.0" stroke="#e2ded6" stroke-width="1" stroke-linecap="round"/><text x="32.0" y="324.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">A factor of ~90 between the top and bottom bar. Measure your own dormant current before sizing anything — published Pico figures</text><text x="32.0" y="342.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">disagree by ~30×, which changes the panel by several times but not the conclusion.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" role="img" aria-label="Field node build - cross-section"><title>Field node build - cross-section</title><rect x="0.0" y="0.0" width="940.0" height="620.0" rx="10" fill="#fcfcfb" stroke="#e2ded6" stroke-width="1"/><text x="32.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#0b0b0b" text-anchor="start">How the node goes together</text><text x="32.0" y="68.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" text-anchor="start">Every detail here exists because leaving it out produces a dead node or plausible-looking wrong data.</text><rect x="32.0" y="96.0" width="512.0" height="328.0" rx="8" fill="#f6f8fa"/><rect x="32.0" y="424.0" width="512.0" height="154.0" rx="8" fill="#efe9df"/><line x1="32.0" y1="424.0" x2="544.0" y2="424.0" stroke="#d8cfc0" stroke-width="2" stroke-linecap="round"/><rect x="214.0" y="232.0" width="15.0" height="250.0" rx="3" fill="#b9a68c"/><path d="M148,232 L221,186 L294,232 L294,360 L148,360 Z" fill="#e8dcc8" stroke="#cbb89a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="221.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8a7a5f" text-anchor="middle">birdbox shell</text><rect x="166.0" y="256.0" width="110.0" height="86.0" rx="6" fill="#fcfcfb" stroke="#87847d" stroke-width="1.5"/><text x="221.0" y="278.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0b0b0b" text-anchor="middle">IP66 box</text><text x="221.0" y="294.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#52514e" text-anchor="middle">Pico 2 W</text><text x="221.0" y="309.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#52514e" text-anchor="middle">LiFePO4 + BMS</text><text x="221.0" y="329.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#87847d" text-anchor="middle">conformal coated</text><circle cx="190.0" cy="342.0" r="4.0" fill="#4a3aa7"/><text x="158.0" y="358.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#4a3aa7" text-anchor="end">vent</text><circle cx="212.0" cy="342.0" r="3.0" fill="#87847d"/><circle cx="232.0" cy="342.0" r="3.0" fill="#87847d"/><circle cx="252.0" cy="342.0" r="3.0" fill="#87847d"/><path d="M330,172 L410,126 L424,144 L344,190 Z" fill="#3a4a63" stroke="#2b384c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="378.0" y1="158.0" x2="366.0" y2="232.0" stroke="#8a8880" stroke-width="2" stroke-linecap="round"/><rect x="352.0" y="232.0" width="28.0" height="7.0" rx="2" fill="#8a8880"/><text x="378.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#52514e" text-anchor="middle">panel @ 65°</text><path d="M74,246 L124,246 L118,254 L80,254 Z" fill="#e9e6df" stroke="#c6c2b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M74,258 L124,258 L118,266 L80,266 Z" fill="#e9e6df" stroke="#c6c2b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M74,270 L124,270 L118,278 L80,278 Z" fill="#e9e6df" stroke="#c6c2b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M74,282 L124,282 L118,290 L80,290 Z" fill="#e9e6df" stroke="#c6c2b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M74,294 L124,294 L118,302 L80,302 Z" fill="#e9e6df" stroke="#c6c2b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="124.0" y1="284.0" x2="166.0" y2="294.0" stroke="#c6c2b8" stroke-width="1.5" stroke-linecap="round"/><text x="99.0" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#52514e" text-anchor="middle">shield + BME280</text><rect x="466.0" y="192.0" width="7.0" height="232.0" rx="2" fill="#b9a68c"/><path d="M446,200 L494,200 L486,232 L454,232 Z" fill="#dfe6ec" stroke="#b9c4ce" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="470.0" y1="168.0" x2="496.0" y2="168.0" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round"/><circle cx="496.0" cy="168.0" r="4.5" fill="#dfe6ec" stroke="#8a8880" stroke-width="1.2"/><line x1="470.0" y1="168.0" x2="457.0" y2="176.7" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round"/><circle cx="457.0" cy="176.7" r="4.5" fill="#dfe6ec" stroke="#8a8880" stroke-width="1.2"/><line x1="470.0" y1="168.0" x2="457.0" y2="159.3" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round"/><circle cx="457.0" cy="159.3" r="4.5" fill="#dfe6ec" stroke="#8a8880" stroke-width="1.2"/><text x="470.0" y="254.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#52514e" text-anchor="middle">rain + wind</text><line x1="232.0" y1="342.0" x2="288.0" y2="456.0" stroke="#87847d" stroke-width="1.5" stroke-linecap="round"/><line x1="252.0" y1="342.0" x2="326.0" y2="516.0" stroke="#87847d" stroke-width="1.5" stroke-linecap="round"/><circle cx="288.0" cy="456.0" r="5.0" fill="#008300"/><circle cx="326.0" cy="516.0" r="5.0" fill="#008300"/><line x1="212.0" y1="342.0" x2="150.0" y2="464.0" stroke="#87847d" stroke-width="1.5" stroke-linecap="round"/><rect x="144.0" y="460.0" width="6.0" height="26.0" rx="2" fill="#eda100"/><text x="134.0" y="468.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#52514e" text-anchor="end">capacitive</text><text x="134.0" y="483.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#52514e" text-anchor="end">moisture ×2</text><text x="300.0" y="460.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#52514e" text-anchor="start">DS18B20 @ 10 cm</text><text x="340.0" y="520.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#52514e" text-anchor="start">DS18B20 @ 30 cm</text><text x="340.0" y="535.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#87847d" text-anchor="start">the lag between them is real information</text><rect x="570.0" y="104.0" width="338.0" height="60.0" rx="7" fill="#f4f2ee"/><rect x="570.0" y="104.0" width="4.0" height="60.0" rx="2" fill="#4a3aa7"/><text x="586.0" y="124.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">ePTFE vent + desiccant, underside</text><text x="586.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#52514e" text-anchor="start">A sealed box breathes: warm day out, cold night</text><text x="586.0" y="155.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#52514e" text-anchor="start">in, and pumps itself full of water over weeks.</text><rect x="570.0" y="172.0" width="338.0" height="60.0" rx="7" fill="#f4f2ee"/><rect x="570.0" y="172.0" width="4.0" height="60.0" rx="2" fill="#eda100"/><text x="586.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">Radiation shield in ASA or PETG, never PLA</text><text x="586.0" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#52514e" text-anchor="start">No shield means you are not measuring air</text><text x="586.0" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#52514e" text-anchor="start">temperature. PLA fails outdoors within 30 days.</text><rect x="570.0" y="240.0" width="338.0" height="60.0" rx="7" fill="#f4f2ee"/><rect x="570.0" y="240.0" width="4.0" height="60.0" rx="2" fill="#e34948"/><text x="586.0" y="260.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">BMS with verified low-temp charge cutoff</text><text x="586.0" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#52514e" text-anchor="start">Charging LiFePO4 below 0 °C plates lithium.</text><text x="586.0" y="291.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#52514e" text-anchor="start">Irreversible. Freezer-test it before deployment.</text><rect x="570.0" y="308.0" width="338.0" height="60.0" rx="7" fill="#f4f2ee"/><rect x="570.0" y="308.0" width="4.0" height="60.0" rx="2" fill="#008300"/><text x="586.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">Panel at 60–75°, due south</text><text x="586.0" y="344.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#52514e" text-anchor="start">Steeper than the annual optimum: trades summer</text><text x="586.0" y="359.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#52514e" text-anchor="start">surplus for winter, and sheds snow and grime.</text><rect x="570.0" y="376.0" width="338.0" height="60.0" rx="7" fill="#f4f2ee"/><rect x="570.0" y="376.0" width="4.0" height="60.0" rx="2" fill="#87847d"/><text x="586.0" y="396.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">Drip loops, glands facing down</text><text x="586.0" y="412.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#52514e" text-anchor="start">Water runs down the cable and falls off the loop</text><text x="586.0" y="427.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#52514e" text-anchor="start">instead of tracking into the enclosure.</text><text x="570.0" y="462.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="start">The wooden birdbox is the rain-and-sun shell, not the seal.</text><text x="570.0" y="480.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52514e" text-anchor="start">Wood is hygroscopic and sits at ambient humidity permanently.</text><text x="570.0" y="496.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#52514e" text-anchor="start">The air gap between the two boxes buffers thermal swings.</text><text x="32.0" y="600.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#87847d" text-anchor="start">Not to scale. Sensor height: WMO convention is 1.25–2 m for comparability with the reference station; lower measures plant microclimate. Record which you chose.</text></svg>

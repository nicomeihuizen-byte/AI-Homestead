[project]
name = "oneacre"
version = "0.1.0"
description = "Off-grid AI homestead: sensor ingest, weather history, biodynamic calendar, solar forecast, local-LLM scheduler"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "skyfield>=1.49",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
ml = ["torch>=2.3", "scikit-learn>=1.5"]
llm = ["ollama>=0.3"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "pre-commit>=3.7"]

[project.scripts]
oneacre = "oneacre.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oneacre"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["hardware: needs the physical node", "network: hits a live API"]
